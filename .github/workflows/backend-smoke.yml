name: Backend smoke

# Manual only: from GitHub's runners upstream's api.wfhelper.com answers 403, so the
# schedule failed every run without saying anything about the backend. Restore it once
# WORKER_URL points at a backend the fork runs.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix backend/worker

      - name: Test deployed Worker
        run: npm --prefix backend/worker run test:smoke
        env:
          WORKER_URL: https://api.wfhelper.com
